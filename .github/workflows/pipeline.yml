name: NFL Pipeline (fetch → features → train → publish)
python scripts/build_features.py --pbp_dir data/raw/nflverse__nflfastR-play-by-play-data \
--schedules_glob "data/external/schedules_*.csv" \
--out data/processed/team_week_features.csv
- name: Smoke test features
run: python scripts/feature_smoke_test.py data/processed/team_week_features.csv


- name: Upload features artifact
uses: actions/upload-artifact@v4
with:
name: team_features
path: data/processed/team_week_features.csv
retention-days: 7


train:
name: Train & calibrate model
needs: [build_features]
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4


- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.11'


- name: Cache pip
uses: actions/cache@v4
with:
path: ~/.cache/pip
key: pip-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}


- name: Install deps
run: |
python -m pip install --upgrade pip
if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
pip install pandas numpy scikit-learn xgboost lightgbm matplotlib joblib


- name: Restore features
uses: actions/download-artifact@v4
with: { name: team_features, path: data/processed }


- name: Train
run: |
python scripts/train_model.py \
--features data/processed/team_week_features.csv \
--out_model models/nfl_model.json \
--out_metrics models/training_metrics.json \
--out_latest_features models/latest_team_features.csv


- name: Calibrate win probabilities (Platt/Isotonic)
run: |
python scripts/calibrate_winprob.py \
--metrics models/training_metrics.json \
--model models/nfl_model.json \
--features models/latest_team_features.csv \
--out models/nfl_model_calibrated.json


- name: Optional: Generate parlays (stub)
run: |
python scripts/generate_parlays.py \
--calibrated_model models/nfl_model_calibrated.json \
--features models/latest_team_features.csv \
--out models/auto_parlays.json || true


- name: Upload model artifacts
uses: actions/upload-artifact@v4
with:
name: model_artifacts
path: |
models/nfl_model.json
models/nfl_model_calibrated.json
models/training_metrics.json
models/latest_team_features.csv
models/auto_parlays.json
retention-days: 30
