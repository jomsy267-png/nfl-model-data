name: nfl-pipeline

on:
  workflow_dispatch:
  schedule:
    # Run daily 10:00 AM America/Edmonton
    # (Two cron lines approximate DST shift)
    - cron: "0 16 * 3-10 *"      # Mar–Oct (UTC-6)
    - cron: "0 17 * 11,12,1,2 *" # Nov–Feb (UTC-7)

permissions:
  contents: write

jobs:
  fetch_schedules:
    name: Fetch schedules from nfldata (force 2025; split)
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars pandas

      - name: Download schedules (nfldata via nflreadpy; season 2025)
        run: |
          python - << 'PY'
          import os, sys
          import polars as pl

          YEAR = 2025
          os.makedirs("data/external", exist_ok=True)

          def write(df):
            # normalize & save both "all" and the year slice
            if "season" in df.columns:
              df = df.with_columns(pl.col("season").cast(pl.Int32, strict=False))
            df.write_csv("data/external/schedules_all.csv")
            if "season" in df.columns:
              dfy = df.filter(pl.col("season")==YEAR)
            else:
              dfy = df
            dfy.write_csv(f"data/external/schedules_{YEAR}.csv")
            print(f"Wrote schedules_all.csv ({df.height} rows)")
            print(f"Wrote schedules_{YEAR}.csv ({dfy.height} rows)")

          try:
            print("[primary] nflreadpy.load_schedules(seasons=[2025]) …")
            import nflreadpy as nfl
            df_any = nfl.load_schedules(seasons=[YEAR])   # pulls from nfldata/nflverse pipelines
            try:
              import pandas as pd
              df_pl = pl.from_pandas(df_any) if hasattr(df_any, "to_dict") else df_any
            except Exception:
              df_pl = pl.DataFrame(df_any)
            if "season" in df_pl.columns:
              df_pl = df_pl.filter(pl.col("season")==YEAR)
            if df_pl.height == 0:
              raise RuntimeError("no rows for 2025")
            write(df_pl)
          except Exception as e:
            print(f"[ERROR] schedules load failed: {e}", file=sys.stderr)
            sys.exit(2)
          PY

      - name: Upload schedules artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedules_split
          path: |
            data/external/schedules_all.csv
            data/external/schedules_2025.csv
          retention-days: 7

  fetch_rosters:
    name: Fetch rosters (2025)
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # nflreadpy is primary; fallback to nfl_data_py only if needed
          pip install nflreadpy polars pandas nfl_data_py

      - name: Download 2025 rosters (primary nflreadpy; fallback nfl_data_py)
        run: |
          python - << 'PY'
          import os, sys, polars as pl
          os.makedirs("data/external", exist_ok=True)
          YEAR = 2025

          def save(df):
              if "season" in df.columns:
                  df = df.with_columns(pl.col("season").cast(pl.Int32, strict=False))
              df.write_csv(f"data/external/rosters_{YEAR}.csv")
              print(f"✅ Wrote data/external/rosters_{YEAR}.csv with {df.height} rows")

          # Try nflreadpy first (dataset name depends on backend; try common paths)
          try:
              import nflreadpy as nfl
              # Some installs expose load_rosters, some expose load_players with seasons
              if hasattr(nfl, "load_rosters"):
                  df_any = nfl.load_rosters(seasons=[YEAR])
              elif hasattr(nfl, "load_players"):
                  df_any = nfl.load_players(seasons=[YEAR])
              else:
                  raise RuntimeError("nflreadpy has no load_rosters/load_players")
              try:
                  import pandas as pd
                  df_pl = pl.from_pandas(df_any) if hasattr(df_any, "to_dict") else df_any
              except Exception:
                  df_pl = pl.DataFrame(df_any)
              if "season" in df_pl.columns:
                  df_pl = df_pl.filter(pl.col("season")==YEAR)
              if df_pl.height == 0:
                  raise RuntimeError("Empty roster for 2025 via nflreadpy")
              save(df_pl)
          except Exception as e:
              print(f"[WARN] nflreadpy roster load failed: {e}", file=sys.stderr)
              try:
                  import nfl_data_py as ndp, pandas as pd
                  df_pd = ndp.import_players()
                  df_pl = pl.from_pandas(df_pd)
                  # This is a career players table; keep as-is for now
                  save(df_pl)
              except Exception as e2:
                  print(f"[ERROR] fallback roster load failed: {e2}", file=sys.stderr)
                  sys.exit(2)
          PY

      - name: Upload rosters artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosters
          path: data/external/rosters_2025.csv
          retention-days: 7


  fetch_pbp:
    name: Fetch play-by-play (last 4 seasons)
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars nflreadpy

      - name: Download PBP via nflreadpy
        run: |
          python - << 'PY'
          import os, polars as pl, nflreadpy as nfl
          os.makedirs("data/raw/nflverse__nflfastR-play-by-play-data", exist_ok=True)
          seasons = [2022, 2023, 2024, 2025]
          df = nfl.load_pbp(seasons=seasons)
          for s in seasons:
            sdf = df.filter(pl.col("season") == s)
            out = f"data/raw/nflverse__nflfastR-play-by-play-data/play_by_play_{s}.csv"
            sdf.write_csv(out)
            print(f"Wrote {out} ({sdf.height} rows)")
          PY

      - name: Upload PBP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbp_raw
          path: data/raw/nflverse__nflfastR-play-by-play-data/play_by_play_*.csv
          retention-days: 7

  build_features:
    name: Build expanded team_week_features.csv
    needs: [fetch_schedules, fetch_pbp]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download schedules artifact
        uses: actions/download-artifact@v4
        with:
          name: schedules_split
          path: data/external

      - name: Download PBP artifact
        uses: actions/download-artifact@v4
        with:
          name: pbp_raw
          path: data/raw/nflverse__nflfastR-play-by-play-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars

      - name: Build expanded features via script
        run: |
          python scripts/build_features.py

      - name: Upload features artifact
        uses: actions/upload-artifact@v4
        with:
          name: team_features
          path: data/processed/team_week_features.csv
          retention-days: 7

  train:
    name: Train logistic model
    needs: [build_features]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: team_features

      - name: Move features into expected path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed models
          if [ -f team_features/team_week_features.csv ]; then
            SRC="team_features/team_week_features.csv"
          elif [ -f team_features/data/processed/team_week_features.csv ]; then
            SRC="team_features/data/processed/team_week_features.csv"
          elif [ -f data/processed/team_week_features.csv ]; then
            echo "Found data/processed/team_week_features.csv already in place."
            exit 0
          else
            echo "ERROR: Could not find team_week_features.csv in the downloaded artifact." >&2
            ls -laR team_features || true
            exit 2
          fi
          cp "$SRC" data/processed/team_week_features.csv
          echo "Copied $SRC -> data/processed/team_week_features.csv"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars numpy scikit-learn

      - name: Train model
        run: |
          python scripts/train_model.py \
            --features data/processed/team_week_features.csv \
            --out_model models/nfl_model.json \
            --out_metrics models/training_metrics.json \
            --out_latest_features models/latest_team_features.csv

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model_artifacts
          path: |
            models/nfl_model.json
            models/training_metrics.json
            models/latest_team_features.csv
          retention-days: 30

  calibrate:
    name: Fit isotonic calibrator
    needs: [train]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Install deps (lean)
        run: |
          python -m pip install --upgrade pip
          pip install polars scikit-learn

      - name: Fit isotonic calibrator
        run: |
          python scripts/calibrate_winprob.py \
            --features_csv data/processed/team_week_features.csv \
            --model_json models/nfl_model.json \
            --out_json models/calibrator_isotonic.json

      - name: Upload calibrator artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibrator
          path: models/calibrator_isotonic.json
          retention-days: 30

  backtest:
    name: Historical backtest
    needs: [train, calibrate]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Download calibrator (optional)
        uses: actions/download-artifact@v4
        with:
          name: calibrator
          path: models
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars

      - name: Run backtest
        run: |
          python scripts/backtest.py \
            --features_csv data/processed/team_week_features.csv \
            --model_json models/nfl_model.json \
            --calibrator_json models/calibrator_isotonic.json \
            --out_dir models

      - name: Build backtest report (Markdown)
        run: |
          python scripts/backtest_report.py

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            models/backtest_by_game.csv
            models/backtest_by_season.csv
            models/backtest_by_week.csv
            models/backtest_metrics.json
            models/backtest_report.md
          retention-days: 30

  train_xgb:
    name: Train XGBoost model
    needs: [build_features]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars scikit-learn xgboost

      - name: Train XGB
        run: |
          mkdir -p models
          python scripts/train_xgb.py \
            --features data/processed/team_week_features.csv \
            --out_model models/xgb_model.json \
            --out_metrics models/xgb_metrics.json

      - name: Upload XGB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgb_artifacts
          path: |
            models/xgb_model.json
            models/xgb_metrics.json
          retention-days: 30

  blend_models:
    name: Blend logistic + XGB
    needs: [train, train_xgb]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download features
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Download logistic artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download xgb artifacts
        uses: actions/download-artifact@v4
        with:
          name: xgb_artifacts
          path: models

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars scikit-learn xgboost numpy

      - name: Fit blend
        run: |
          python scripts/blend_models.py \
            --features data/processed/team_week_features.csv \
            --logit_model models/nfl_model.json \
            --xgb_model models/xgb_model.json \
            --out_model models/blended_model.json \
            --out_metrics models/blend_metrics.json

      - name: Upload blended artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blended_artifacts
          path: |
            models/blended_model.json
            models/blend_metrics.json
          retention-days: 30

  predict_and_report:
    name: Score upcoming games + report (blend-aware, null-safe, calibrated)
    needs: [train, calibrate, blend_models]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download blended artifacts (optional)
        uses: actions/download-artifact@v4
        with:
          name: blended_artifacts
          path: models
        continue-on-error: true

      - name: Download xgb artifacts (for scoring if blended)
        uses: actions/download-artifact@v4
        with:
          name: xgb_artifacts
          path: models
        continue-on-error: true

      - name: Download features (for context in report)
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Download calibrator (optional)
        uses: actions/download-artifact@v4
        with:
          name: calibrator
          path: models
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars xgboost numpy

      - name: Predict + report (blend-aware, null-safe)
        run: |
          python - << 'PY'
          import json, os, sys, bisect
          import polars as pl

          def load_json(p):
            with open(p) as f: return json.load(f)

          # Choose model: blended if available else logistic
          if os.path.exists("models/blended_model.json"):
            model = load_json("models/blended_model.json")
          else:
            model = load_json("models/nfl_model.json")

          # Choose features file (prefer latest)
          features_path = "models/latest_team_features.csv"
          if not os.path.exists(features_path):
            features_path = "data/processed/team_week_features.csv"
          if not os.path.exists(features_path):
            print("No features available for prediction.", file=sys.stderr)
            os.makedirs("models", exist_ok=True)
            with open("models/predictions.csv","w") as f: f.write("note\nno features\n")
            with open("models/report.md","w") as f: f.write("# NFL Model Report\n\n_No features to score._\n")
            sys.exit(0)

          df = pl.read_csv(features_path)

          def ensure_cols(df, cols):
            for c in cols:
              if c not in df.columns:
                df = df.with_columns(pl.lit(0.0).alias(c))
            return df.with_columns([pl.col(c).cast(pl.Float64).fill_null(0.0) for c in cols])

          def score_logistic_expr(df, feats, coef, intercept):
            logit = pl.lit(float(intercept))
            for c, w in zip(feats, coef):
              logit = logit + pl.col(c) * float(w)
            return (1 / (1 + (-logit).exp())).alias("p_logit")

          # Build p_raw
          if model.get("model_type") == "blend_linear" and \
             os.path.exists("models/nfl_model.json") and os.path.exists("models/xgb_model.json"):
            lm = load_json("models/nfl_model.json")
            xm = load_json("models/xgb_model.json")
            feats_l = lm.get("features", []); feats_x = xm.get("features", [])
            df = ensure_cols(df, list(dict.fromkeys(feats_l + feats_x)))

            # logistic part
            df = df.with_columns(score_logistic_expr(df, feats_l, lm.get("coef", []), lm.get("intercept", 0.0)))
            # xgb part
            import numpy as np, xgboost as xgb
            dmat = xgb.DMatrix(df.select(feats_x).to_numpy())
            booster = xgb.Booster(); booster.load_model(bytearray(xm["booster_json"], "utf-8"))
            p_xgb = booster.predict(dmat)
            df = df.with_columns(pl.Series("p_xgb", p_xgb))

            a = float(model.get("alpha_logistic", 0.5))
            df = df.with_columns((a*pl.col("p_logit") + (1-a)*pl.col("p_xgb")).alias("p_raw"))
          else:
            feats = model.get("features", []); coef = model.get("coef", []); intercept = model.get("intercept", 0.0)
            df = ensure_cols(df, feats)
            df = df.with_columns(score_logistic_expr(df, feats, coef, intercept).alias("p_raw"))

          # Optional isotonic calibration
          if os.path.exists("models/calibrator_isotonic.json"):
            try:
              c = load_json("models/calibrator_isotonic.json")
              xs, ys = c["x_thresholds"], c["y_values"]
              def calibrate_scalar(p):
                i = bisect.bisect_right(xs, float(p)) - 1
                if i < 0: return float(ys[0])
                if i >= len(xs) - 1: return float(ys[-1])
                x0, x1 = xs[i], xs[i+1]; y0, y1 = ys[i], ys[i+1]
                if x1 == x0: return float(y0)
                t = (float(p) - x0) / (x1 - x0)
                return float(y0 + t * (y1 - y0))
              df = df.with_columns(pl.col("p_raw").map_elements(calibrate_scalar).alias("home_win_prob"))
            except Exception:
              df = df.with_columns(pl.col("p_raw").alias("home_win_prob"))
          else:
            df = df.with_columns(pl.col("p_raw").alias("home_win_prob"))

          base_cols = [c for c in ["season","week","game_id","home_team","away_team","spread_line","total_line","implied_margin","implied_total"] if c in df.columns]
          out = df.select(base_cols + ["home_win_prob"]).sort("home_win_prob", descending=True)

          os.makedirs("models", exist_ok=True)
          out.write_csv("models/predictions.csv")

          def fmt(v, nd=3):
            try: return f"{float(v):.{nd}f}"
            except: return str(v)

          top = out.head(5)
          lines = ["# NFL Model Report", "",
                   f"_Using {'blended' if model.get('model_type')=='blend_linear' else 'logistic'} model_",
                   "",
                   "## Top 5 upcoming (by home_win_prob)", ""]
          if top.height == 0:
            lines.append("_No upcoming games found to score._")
          else:
            lines.append("| season | week | game_id | home_team | away_team | home_win_prob |")
            lines.append("|---:|---:|---|---|---|---:|")
            for r in top.iter_rows(named=True):
              lines.append(f"| {r.get('season','')} | {r.get('week','')} | {r.get('game_id','')} | {r.get('home_team','')} | {r.get('away_team','')} | {fmt(r.get('home_win_prob',0.0),3)} |")
          with open("models/report.md","w") as f:
            f.write("\n".join(lines))
          PY

      - name: Upload predictions/report
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: |
            models/predictions.csv
            models/report.md
          retention-days: 30

  discord_push:
    name: Post daily report to Discord (zipped bundle incl. schedules/rosters)
    needs: [predict_and_report, backtest]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"%Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      # Core artifacts
      - name: Download predictions artifact
        uses: actions/download-artifact@v4
        with:
          name: predictions
          path: models

      - name: Download backtest artifact
        uses: actions/download-artifact@v4
        with:
          name: backtest
          path: models
        continue-on-error: true

      - name: Download model artifacts (metrics)
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models
        continue-on-error: true

      - name: Download calibrator (optional)
        uses: actions/download-artifact@v4
        with:
          name: calibrator
          path: models
        continue-on-error: true

      - name: Download blended artifacts (optional)
        uses: actions/download-artifact@v4
        with:
          name: blended_artifacts
          path: models
        continue-on-error: true

      - name: Download xgb artifacts (optional)
        uses: actions/download-artifact@v4
        with:
          name: xgb_artifacts
          path: models
        continue-on-error: true

      # NEW: schedules + rosters so the bundle always includes them
      - name: Download schedules artifact
        uses: actions/download-artifact@v4
        with:
          name: schedules_split
          path: models
        continue-on-error: true

      - name: Download rosters artifact
        uses: actions/download-artifact@v4
        with:
          name: rosters
          path: models
        continue-on-error: true

      - name: Build short Discord message (<= 2000 chars)
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUN="${GITHUB_RUN_NUMBER}"
          DATE_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo "**NFL Daily — ${REPO} #${RUN}**"
            echo "_${DATE_UTC}_"
            echo
            if [ -f models/report.md ]; then
              echo "**Model Report (preview):**"
              sed -n '1,20p' models/report.md
              echo
            fi
            if [ -f models/backtest_report.md ]; then
              echo "**Backtest (preview):**"
              sed -n '1,15p' models/backtest_report.md
              echo
            fi
            echo "_Attached: zipped bundle with predictions, reports, schedules, rosters, and metrics._"
          } > discord_message.txt
          head -c 1900 discord_message.txt > discord_message_trimmed.txt
          CONTENT=$(jq -Rs '.' < discord_message_trimmed.txt)
          echo "{\"content\": ${CONTENT}}" > payload.json
          echo "payload.json built"

      - name: Create ZIP bundle
        id: zipstep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          add_if_exists () {
            if [ -f "$1" ]; then
              cp -f "$1" "out/$(basename "$1")"
              echo "Added: $1"
            else
              echo "Missing: $1"
            fi
          }

          # Core deliverables
          add_if_exists models/report.md
          add_if_exists models/predictions.csv
          add_if_exists models/backtest_report.md

          # Metrics/config if present
          add_if_exists models/training_metrics.json
          add_if_exists models/backtest_metrics.json
          add_if_exists models/blend_metrics.json
          add_if_exists models/xgb_metrics.json
          add_if_exists models/calibrator_isotonic.json

          # NEW: schedules + rosters (names depend on earlier jobs)
          add_if_exists models/schedules_2025.csv
          add_if_exists models/schedules_all.csv
          add_if_exists models/rosters_2025.csv

          # If nothing collected, add a placeholder
          if [ -z "$(ls -A out || true)" ]; then
            echo "No output files found to include." > out/README.txt
          fi

          BUNDLE="NFL_Bundle_${GITHUB_REPOSITORY//\//_}_run${GITHUB_RUN_NUMBER}.zip"
          (cd out && zip -q -r "../${BUNDLE}" .)
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "Created bundle: ${BUNDLE}"

      - name: Show bundle contents (debug)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.zipstep.outputs.bundle }}"
          echo "--- models dir ---"; ls -la models || true
          echo "--- zip listing ---"; unzip -l "$BUNDLE" || (echo "unzip unavailable"; ls -la "$BUNDLE")

      - name: Send to Discord (message + ZIP only)
        shell: bash
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "ERROR: Missing DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

          BUNDLE="${{ steps.zipstep.outputs.bundle }}"
          if [ ! -f "$BUNDLE" ]; then
            echo "ERROR: Missing bundle zip: $BUNDLE"
            exit 1
          fi

          # Use --form-string so payload_json is not uploaded as a file
          curl -sS -X POST "$WEBHOOK" \
            --form-string "payload_json=$(cat payload.json)" \
            -F "file1=@${BUNDLE}" > /dev/null

          echo "Sent Discord message with bundle: ${BUNDLE}"
