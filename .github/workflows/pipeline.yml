name: nfl-pipeline
on:
  workflow_dispatch:

jobs:
  fetch_schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars

      - name: Download schedules via nflreadpy and split by year (Polars)
        run: |
          python - << 'PY'
          import os
          import polars as pl
          import nflreadpy as nfl  # returns Polars DataFrames
          os.makedirs("data/external", exist_ok=True)

          df = nfl.load_schedules()  # Polars DataFrame
          df.write_csv("data/external/schedules_all.csv")

          seasons = df.get_column("season").unique().to_list()
          for season in seasons:
            sdf = df.filter(pl.col("season") == season)
            out = f"data/external/schedules_{season}.csv"
            sdf.write_csv(out)
            print(f"Wrote {out} ({sdf.height} rows)")
          PY

      - name: Upload schedules artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedules_split
          path: |
            data/external/schedules_all.csv
            data/external/schedules_*.csv
          retention-days: 7
