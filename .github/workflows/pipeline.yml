name: nfl-pipeline
on:
  workflow_dispatch:

jobs:
  fetch_schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy pandas

      - name: Download schedules via nflreadpy and split by year
        run: |
          python - << 'PY'
          import os
          import pandas as pd
          import nflreadpy as nfl  # official python port of nflreadr
          os.makedirs("data/external", exist_ok=True)

          df = nfl.load_schedules()                 # all seasons (past+future)
          # Persist a full CSV (optional but handy for inspection)
          df.to_csv("data/external/schedules_all.csv", index=False)

          # Split by season for downstream steps
          for season, sdf in df.groupby("season"):
            out = f"data/external/schedules_{season}.csv"
            sdf.to_csv(out, index=False)
            print(f"Wrote {out} ({len(sdf)} rows)")
          PY

      - name: Upload schedules artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedules_split
          path: |
            data/external/schedules_all.csv
            data/external/schedules_*.csv
          retention-days: 7
