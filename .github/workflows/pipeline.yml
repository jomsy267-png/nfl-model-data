name: nfl-pipeline

on:
  # Run manually anytime
  workflow_dispatch:
  # Run daily at 10:00 AM America/Edmonton, accounting for DST shift
  schedule:
    # DST window (MDT): roughly March–October
    - cron: "0 16 * 3-10 *"
    # Standard time (MST): November–February
    - cron: "0 17 * 11,12,1,2 *"

permissions:
  contents: write

jobs:
  fetch_schedules:
    name: Fetch schedules (scores + closing lines)
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars

      - name: Download schedules via nflreadpy and split by year (Polars)
        run: |
          python - << 'PY'
          import os
          import polars as pl
          import nflreadpy as nfl
          os.makedirs("data/external", exist_ok=True)

          df = nfl.load_schedules()
          df.write_csv("data/external/schedules_all.csv")

          seasons = df.get_column("season").unique().to_list()
          for season in sorted(seasons):
            sdf = df.filter(pl.col("season") == season)
            out = f"data/external/schedules_{season}.csv"
            sdf.write_csv(out)
            print(f"Wrote {out} ({sdf.height} rows)")
          PY

      - name: Upload schedules artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedules_split
          path: |
            data/external/schedules_all.csv
            data/external/schedules_*.csv
          retention-days: 7

  fetch_pbp:
    name: Fetch play-by-play (last 4 seasons)
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install nflreadpy polars

      - name: Download PBP via nflreadpy (Polars)
        run: |
          python - << 'PY'
          import os, polars as pl, nflreadpy as nfl
          os.makedirs("data/raw/nflverse__nflfastR-play-by-play-data", exist_ok=True)

          seasons = [2022, 2023, 2024, 2025]
          df = nfl.load_pbp(seasons=seasons)
          for s in seasons:
            sdf = df.filter(pl.col("season") == s)
            out = f"data/raw/nflverse__nflfastR-play-by-play-data/play_by_play_{s}.csv"
            sdf.write_csv(out)
            print(f"Wrote {out} ({sdf.height} rows)")
          PY

      - name: Upload PBP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbp_raw
          path: data/raw/nflverse__nflfastR-play-by-play-data/play_by_play_*.csv
          retention-days: 7

  build_features:
    name: Build expanded team_week_features.csv
    needs: [fetch_schedules, fetch_pbp]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download schedules artifact
        uses: actions/download-artifact@v4
        with:
          name: schedules_split
          path: data/external

      - name: Download PBP artifact
        uses: actions/download-artifact@v4
        with:
          name: pbp_raw
          path: data/raw/nflverse__nflfastR-play-by-play-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars

      - name: Build expanded features via script
        run: |
          python scripts/build_features.py

      - name: Upload features artifact
        uses: actions/upload-artifact@v4
        with:
          name: team_features
          path: data/processed/team_week_features.csv
          retention-days: 7

  train:
    name: Train toy model (logistic regression)
    needs: [build_features]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      # Download features artifact into ./team_features/
      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: team_features

      - name: Inspect workspace (before training)
        run: |
          echo "PWD: $(pwd)"
          echo "--- top level ---"
          ls -la
          echo "--- team_features (artifact contents) ---"
          ls -laR team_features || true
          echo "--- data/processed (pre-existing, if any) ---"
          ls -laR data/processed || true

      # Robustly locate team_week_features.csv regardless of artifact layout
      - name: Move features into expected path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed models
          if [ -f team_features/team_week_features.csv ]; then
            SRC="team_features/team_week_features.csv"
          elif [ -f team_features/data/processed/team_week_features.csv ]; then
            SRC="team_features/data/processed/team_week_features.csv"
          elif [ -f data/processed/team_week_features.csv ]; then
            echo "Found data/processed/team_week_features.csv already in place."
            exit 0
          else
            echo "ERROR: Could not find team_week_features.csv in the downloaded artifact." >&2
            echo "Tree of ./team_features for debugging:" >&2
            ls -laR team_features || true
            exit 2
          fi
          cp "$SRC" data/processed/team_week_features.csv
          echo "Copied $SRC -> data/processed/team_week_features.csv"

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars numpy scikit-learn

      - name: Train model
        shell: bash
        run: |
          set -euo pipefail
          python scripts/train_model.py --features data/processed/team_week_features.csv --out_model models/nfl_model.json --out_metrics models/training_metrics.json --out_latest_features models/latest_team_features.csv

      - name: Show produced model files
        run: |
          echo "--- models dir ---"
          ls -la models || true
          echo "--- metrics preview ---"
          test -f models/training_metrics.json && head -n 50 models/training_metrics.json || echo "metrics missing"
          echo "--- latest features preview ---"
          test -f models/latest_team_features.csv && head -n 5 models/latest_team_features.csv || echo "latest features missing"

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model_artifacts
          path: |
            models/nfl_model.json
            models/training_metrics.json
            models/latest_team_features.csv
          if-no-files-found: error
          retention-days: 30

  calibrate:
    name: Fit isotonic calibrator
    needs: [train]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      # STEP 2 (Install deps) — choose ONE option (A recommended)
      - name: Install deps (lean)
        run: |
          python -m pip install --upgrade pip
          pip install polars scikit-learn

      # - name: Install deps (expanded)
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install numpy scipy scikit-learn polars

      - name: Fit isotonic calibrator
        run: |
          python scripts/calibrate_winprob.py \
            --features_csv data/processed/team_week_features.csv \
            --model_json models/nfl_model.json \
            --out_json models/calibrator_isotonic.json

      - name: Show calibrator
        run: |
          echo "--- models dir ---"
          ls -la models || true
          echo "--- calibrator preview ---"
          test -f models/calibrator_isotonic.json && head -n 40 models/calibrator_isotonic.json || echo "no calibrator saved"

      - name: Upload calibrator artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibrator
          path: models/calibrator_isotonic.json
          if-no-files-found: warn
          retention-days: 30

  predict_and_report:
    name: Score upcoming games + report (pure Polars, null-safe, calibrated if available)
    needs: [train, calibrate]
    runs-on: ubuntu-latest
    steps:
      - name: Print current times (UTC & Edmonton)
        run: |
          echo "UTC:       $(date -u)"
          TZ=America/Edmonton date +"Edmonton: %Y-%m-%d %H:%M:%S %Z"

      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model_artifacts
          path: models

      - name: Download features (for context in report)
        uses: actions/download-artifact@v4
        with:
          name: team_features
          path: data/processed

      - name: Download calibrator (optional)
        uses: actions/download-artifact@v4
        with:
          name: calibrator
          path: models
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars

      - name: Predict using saved logistic model + make report (null-safe, optional calibration)
        run: |
          python - << 'PY'
          import json, os, sys, bisect, polars as pl

          # Load model
          try:
            with open("models/nfl_model.json") as f:
              model = json.load(f)
          except Exception as e:
            print(f"Could not load model: {e}", file=sys.stderr)
            os.makedirs("models", exist_ok=True)
            with open("models/predictions.csv","w") as f: f.write("note\nno model available\n")
            with open("models/report.md","w") as f: f.write("# NFL Model Report\n\n_No model available._\n")
            sys.exit(0)

          # Optional calibrator
          calibrator = None
          cal_path = "models/calibrator_isotonic.json"
          if os.path.exists(cal_path):
            try:
              with open(cal_path) as f:
                c = json.load(f)
                if c.get("type") == "isotonic" and "x_thresholds" in c and "y_values" in c:
                  calibrator = (c["x_thresholds"], c["y_values"])
            except Exception:
              pass

          # Choose features file (prefer latest, else full)
          features_path = "models/latest_team_features.csv"
          if not os.path.exists(features_path):
            features_path = "data/processed/team_week_features.csv"
          if not os.path.exists(features_path):
            print("No features available for prediction.", file=sys.stderr)
            os.makedirs("models", exist_ok=True)
            with open("models/predictions.csv","w") as f: f.write("note\nno features\n")
            with open("models/report.md","w") as f: f.write("# NFL Model Report\n\n_No features to score._\n")
            sys.exit(0)

          df = pl.read_csv(features_path)

          feats = model.get("features", [])
          coef = model.get("coef", [])
          intercept = float(model.get("intercept", 0.0))
          if not feats or not coef or len(feats) != len(coef):
            os.makedirs("models", exist_ok=True)
            with open("models/predictions.csv","w") as f:
              f.write("note\nmodel has no usable features\n")
            with open("models/report.md","w") as f:
              f.write("# NFL Model Report\n\n_Model has no usable features; predictions skipped._\n")
            sys.exit(0)

          # Ensure features exist & are float, fill nulls with 0.0
          for c in feats:
            if c not in df.columns:
              df = df.with_columns(pl.lit(0.0).alias(c))
          df = df.with_columns([pl.col(c).cast(pl.Float64).fill_null(0.0) for c in feats])

          # Raw probability via logistic
          logit = pl.lit(intercept)
          for c, w in zip(feats, coef):
            logit = logit + pl.col(c) * float(w)
          p_raw = (1 / (1 + (-logit).exp())).alias("p_raw")

          # Apply isotonic calibration if available
          if calibrator:
            xs, ys = calibrator
            def calibrate_scalar(p):
              i = bisect.bisect_right(xs, float(p)) - 1
              if i < 0:
                return float(ys[0])
              if i >= len(xs) - 1:
                return float(ys[-1])
              x0, x1 = xs[i], xs[i+1]
              y0, y1 = ys[i], ys[i+1]
              if x1 == x0:
                return float(y0)
              t = (float(p) - x0) / (x1 - x0)
              return float(y0 + t * (y1 - y0))
            out_prob = pl.col("p_raw").map_elements(calibrate_scalar).alias("home_win_prob")
          else:
            out_prob = p_raw.alias("home_win_prob")

          base_cols = [c for c in ["season","week","game_id","home_team","away_team","spread_line","total_line","implied_margin","implied_total"] if c in df.columns]
          out = df.with_columns(p_raw).select(base_cols + [out_prob]).sort("home_win_prob", descending=True)

          os.makedirs("models", exist_ok=True)
          out.write_csv("models/predictions.csv")

          # Metrics summary (optional)
          def fmt(v, nd=3):
            try: return f"{float(v):.{nd}f}"
            except: return str(v)

          metrics = {}
          try:
            with open("models/training_metrics.json") as f:
              metrics = json.load(f)
          except Exception:
            pass

          top = out.head(5)
          lines = ["# NFL Model Report", "", "## Metrics"]
          if metrics:
            for k in ["train_auc","test_auc","train_logloss","test_logloss","train_acc","test_acc"]:
              if k in metrics: lines.append(f"- **{k}**: {fmt(metrics[k])}")
          else:
            lines.append("_No metrics available_")
          lines.append("")
          lines.append(f"## Top 5 upcoming (by {'calibrated ' if calibrator else ''}home_win_prob)")
          if top.height == 0:
            lines.append("_No upcoming games found to score._")
          else:
            lines += ["", "| season | week | game_id | home_team | away_team | home_win_prob |",
                           "|---:|---:|---|---|---|---:|"]
            for r in top.iter_rows(named=True):
              lines.append(f"| {r.get('season','')} | {r.get('week','')} | {r.get('game_id','')} | {r.get('home_team','')} | {r.get('away_team','')} | {fmt(r.get('home_win_prob',0.0),3)} |")
          with open("models/report.md","w") as f:
            f.write("\n".join(lines))
          PY

      - name: Upload predictions/report
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: |
            models/predictions.csv
            models/report.md
          retention-days: 30
