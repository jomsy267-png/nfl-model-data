name: Fetch NFL schedules (scores + closing lines)

on:
  schedule:
    # GitHub Actions uses UTC. 10:15 AM America/Edmonton ≈ 16:15 UTC.
    - cron: "15 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: true

jobs:
  fetch:
    name: Download schedules and split by year
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/external

      - name: Download schedules (robust)
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/nflverse/nflverse-data/releases/download/schedules"
          got=""
          for FN in schedules.csv.gz schedules.csv; do
            URL="${BASE}/${FN}"
            echo "Trying ${URL}"
            if curl -fL --retry 5 --retry-delay 2 "$URL" -o "data/external/${FN}"; then
              echo "Downloaded ${FN}"
              got="${FN}"
              break
            fi
          done
          if [ -z "$got" ]; then
            echo "ERROR: Could not download schedules.csv(.gz)" >&2
            exit 2
          fi

      - name: Split schedules into yearly CSVs
        shell: bash
        run: |
          set -euo pipefail
          cd data/external
          if [ -f schedules.csv.gz ]; then
            gzip -dc schedules.csv.gz > schedules.csv
          fi
          # Column 2 in nflverse schedules is 'season'. Adjust if your column order differs.
          awk -F, 'NR==1{hdr=$0; next} {out=sprintf("schedules_%s.csv",$2); if(!(out in seen)){print hdr > out; seen[out]=1} print >> out}' schedules.csv
          ls -l schedules_*.csv | head -n 10

      - name: Upload schedules artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedules_split
          path: data/external/schedules_*.csv
          retention-days: 7
